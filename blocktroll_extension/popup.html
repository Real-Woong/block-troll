<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BlockTroll</title>
  <style>
    body{font-family:system-ui,-apple-system,sans-serif;margin:12px;width:300px;background:#f6f8fb;color:#172033}
    .row{margin:10px 0}
    .card{background:#fff;border:1px solid #dfe6f0;border-radius:14px;padding:12px;box-shadow:0 8px 24px rgba(23,32,51,.06)}
    .levels button{width:100%;margin:6px 0;padding:10px;border-radius:10px;border:1px solid #d9e0ea;background:#fff;cursor:pointer;font-weight:600}
    .active{border:2px solid #172033;background:#eef4ff}
    .hint{font-size:12px;color:#5f6b7a}
    .statusline{display:flex;align-items:center;gap:8px;font-size:12px}
    .dot{width:10px;height:10px;border-radius:999px;background:#c4ccd8}
    .dot.ok{background:#27ae60}
    .dot.bad{background:#d64545}
    .mini{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
    .mini div{background:#f6f8fb;border-radius:10px;padding:8px}
    .label{font-size:11px;color:#6a7685;margin-bottom:4px}
    .value{font-size:14px;font-weight:700}
    .banner{margin-top:10px;padding:10px;border-radius:10px;background:#fff3cd;color:#6b4e00;font-size:12px}
  </style>
</head>
<body>
  <h3 style="margin:0 0 8px 0;">BlockTroll</h3>
  <div class="card">
    <div class="statusline">
      <span id="serverDot" class="dot"></span>
      <span id="serverStatus" class="hint">서버 상태 확인 중</span>
    </div>

    <div class="mini">
      <div>
        <div class="label">현재 강도</div>
        <div class="value" id="currentIntensity">보통</div>
      </div>
      <div>
        <div class="label">TAUNT 상태</div>
        <div class="value" id="tauntStatus">OFF</div>
      </div>
    </div>

    <div class="mini">
      <div>
        <div class="label">SOFT 기준</div>
        <div class="value" id="softValue">0.60</div>
      </div>
      <div>
        <div class="label">HARD 기준</div>
        <div class="value" id="hardValue">0.75</div>
      </div>
    </div>
  </div>

  <div class="row hint" style="margin-top:12px;">필터링 강도를 선택하세요</div>

  <div class="row levels">
    <button data-level="1">낮음</button>
    <button data-level="2">보통</button>
    <button data-level="3">높음</button>
  </div>

  <div class="row card">
    <label><input type="checkbox" id="enableTaunt"> TAUNT(비꼼) 포함</label><br/>
    <label><input type="checkbox" id="enableToxic"> TOXIC(욕설) 포함</label><br/>
    <label><input type="checkbox" id="enableSpam"> SPAM 포함</label>
  </div>

  <div class="banner">
    현재 권장 모드는 `욕설 + 스팸` 중심입니다. 비꼼(TAUNT)은 오탐이 많아 기본적으로 꺼져 있습니다.
  </div>

  <div class="row hint" id="status"></div>

  <script src="popup.js"></script>
</body>
</html>
