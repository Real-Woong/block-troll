<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>BlockTroll Options</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; margin: 20px; background:#f6f8fb; color:#172033; }
    .row { margin: 12px 0; }
    label { display: inline-block; min-width: 160px; }
    input[type="number"] { width: 90px; }
    .hint { color: #666; font-size: 12px; }
    .box { padding: 16px; border: 1px solid #dfe6f0; border-radius: 14px; max-width: 640px; background:#fff; box-shadow:0 10px 28px rgba(23,32,51,.05); }
    button { padding: 8px 12px; }
    .banner { margin: 0 0 14px 0; padding: 12px; background:#eef4ff; border:1px solid #d6e4ff; border-radius: 12px; max-width: 640px; }
    .warn { margin-top: 14px; padding: 12px; background:#fff8e6; border:1px solid #f3df9b; border-radius: 12px; }
  </style>
</head>
<body>
  <h2>BlockTroll 설정</h2>
  <div class="banner">
    <strong>현재 권장:</strong> 욕설(TOXIC) + 스팸(SPAM) 중심으로 사용하고, 비꼼(TAUNT)은 오탐이 많아 기본적으로 끄는 것을 추천합니다.
  </div>

  <div class="box">
    <div class="row">
      <label>서버 URL</label>
      <input id="serverUrl" type="text" style="width: 320px;" />
      <div class="hint">기본값: http://127.0.0.1:8787</div>
    </div>

    <div class="row">
      <label>모드</label>
      <select id="mode">
        <option value="blur_click">블러 + 클릭시 보기</option>
        <option value="blur">블러 고정</option>
        <option value="hide">숨김</option>
      </select>
    </div>

    <div class="row">
      <label>TAUNT(비꼼) 필터</label>
      <input id="enableTaunt" type="checkbox" />
      <span class="hint">오탐이 많아 기본 OFF 추천</span>
    </div>

    <div class="row">
      <label>TOXIC(욕설) 필터</label>
      <input id="enableToxic" type="checkbox" />
    </div>

    <div class="row">
      <label>SPAM 필터</label>
      <input id="enableSpam" type="checkbox" />
    </div>

    <div class="row">
      <label>SOFT 임계치</label>
      <input id="softThreshold" type="number" step="0.01" min="0" max="1" />
      <span class="hint">직접 저장하면 팝업 강도보다 이 값이 우선 적용됩니다</span>
    </div>

    <div class="row">
      <label>HARD 임계치</label>
      <input id="hardThreshold" type="number" step="0.01" min="0" max="1" />
      <span class="hint">낮음 강도보다 더 보수적으로 하고 싶으면 값을 높이세요</span>
    </div>

    <div class="row">
      <button id="saveBtn">저장</button>
      <span id="status" class="hint"></span>
    </div>

    <div class="warn hint">
      팝업의 `낮음/보통/높음`은 간단 설정입니다. 여기서 threshold를 저장하면 `직접 설정 모드`로 전환되어 팝업 강도보다 우선 적용됩니다.
    </div>
  </div>

  <script src="options.js"></script>
</body>
</html>
